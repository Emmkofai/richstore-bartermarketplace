<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Login to RichStore to buy or sell items.">
<title>Login — RichStore</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site">
  <div class="site-inner">
    <a href="index.html" class="logo">RichStore<span class="dot">.</span></a>
    <form class="searchbar" onsubmit="event.preventDefault(); location.href='index.html?search='+encodeURIComponent(this.q.value)">
      <input type="text" name="q" placeholder="Search for anything…" autocomplete="off" aria-label="Search listings">
      <button type="submit">Search</button>
    </form>
    <div class="nav-actions">
      <a href="cart.html" class="cart-link" aria-label="Shopping cart">🛒 <span class="cart-count" id="cart-count">0</span></a>
    </div>
  </div>
</header>

<main class="wrap" style="padding-top:36px;display:flex;justify-content:center;">
  <div class="form-card" style="max-width:520px;">
    <h1 class="section-title" style="margin-bottom:6px;text-align:center;">Welcome Back</h1>
    <p style="text-align:center;color:var(--ink-lighter);font-size:15.7px;margin-bottom:20px;">
      Choose your login type to access your account
    </p>

    <!-- Account Type Tabs -->
    <div class="account-type-tabs" role="tablist">
      <button type="button" class="account-type-tab active" id="tab-login-seller" role="tab" aria-selected="true" onclick="switchLoginType('seller')">
        <span>Login as Seller</span>
      </button>
      <button type="button" class="account-type-tab" id="tab-login-buyer" role="tab" aria-selected="false" onclick="switchLoginType('buyer')">
        <span>Login as Buyer</span>
      </button>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <input type="hidden" id="login-account-type" value="seller">

      <div class="field">
        <label for="username" id="username-label">Username / Store Name</label>
        <input id="username" type="text" name="username" autocomplete="username" placeholder="Enter your username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <div id="login-feedback" style="display:none;margin-bottom:14px;padding:10px 14px;border-radius:8px;font-size:15.7px;font-weight:600;"></div>

      <button class="btn primary" type="submit" id="login-btn" style="width:100%;padding:14px;font-size:17.9px;">
        Login as Seller
      </button>

      <p style="margin-top:16px;text-align:center;font-size:15.7px;">
        Don't have an account? <a href="signup.html" style="color:var(--paper-raised);font-weight:700;">Sign up here</a>
      </p>
    </form>
  </div>
</main>

<footer class="site"><em>RichStore. Copyright © 2026</em></footer>

<script src="js/cart.js"></script>
<script>
let currentLoginType = 'seller';

function switchLoginType(type) {
  currentLoginType = type;
  document.getElementById('login-account-type').value = type;

  const tabSeller = document.getElementById('tab-login-seller');
  const tabBuyer = document.getElementById('tab-login-buyer');
  const submitBtn = document.getElementById('login-btn');
  const label = document.getElementById('username-label');
  const feedback = document.getElementById('login-feedback');
  feedback.style.display = 'none';

  if (type === 'seller') {
    tabSeller.classList.add('active');
    tabSeller.setAttribute('aria-selected', 'true');
    tabBuyer.classList.remove('active');
    tabBuyer.setAttribute('aria-selected', 'false');
    submitBtn.textContent = 'Login as Seller';
    label.textContent = 'Seller Username / Store Name';
  } else {
    tabBuyer.classList.add('active');
    tabBuyer.setAttribute('aria-selected', 'true');
    tabSeller.classList.remove('active');
    tabSeller.setAttribute('aria-selected', 'false');
    submitBtn.textContent = 'Login as Buyer';
    label.textContent = 'Buyer Username';
  }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const feedback = document.getElementById('login-feedback');
  feedback.style.display = 'none';

  btn.disabled = true;
  btn.textContent = 'Logging in…';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const accountType = currentLoginType;

  const { ok, data } = await api.post('/api/login', { username, password, accountType });
  if (!ok) {
    btn.disabled = false;
    btn.textContent = accountType === 'seller' ? 'Login as Seller' : 'Login as Buyer';

    if (data.suggestedType) {
      feedback.style.display = 'block';
      feedback.style.background = '#eff6ff';
      feedback.style.color = '#1e40af';
      feedback.style.border = '1.5px solid #bfdbfe';
      feedback.innerHTML = `
        <div>${escapeHTML(data.error || 'Account type mismatch')}</div>
        <button type="button" onclick="switchLoginType('${data.suggestedType}')" style="margin-top:8px;padding:6px 12px;background:#0000CD;color:#fff;border:none;border-radius:6px;font-size:14.6px;font-weight:700;cursor:pointer;">
          Switch to ${data.suggestedType === 'seller' ? 'Seller' : 'Buyer'} Login
        </button>
      `;
    } else {
      feedback.style.display = 'block';
      feedback.style.background = '#fef2f2';
      feedback.style.color = '#991b1b';
      feedback.style.border = '1.5px solid #fecaca';
      feedback.textContent = data.error || 'Login failed. Please check your credentials.';
    }
    return;
  }

  localStorage.setItem('auth_token', data.token);
  localStorage.setItem('auth_user', JSON.stringify(data.user));
  updateAuthUI();
  showToast('Logged in successfully');

  // Whitelist the redirect target: same-origin relative paths only
  const rawRedirect = new URLSearchParams(location.search).get('redirect');
  const normalizedRedirect = rawRedirect ? (rawRedirect.startsWith('/') ? rawRedirect : '/' + rawRedirect) : '';
  let redirect = (normalizedRedirect && !normalizedRedirect.startsWith('//') && !/^https?:/i.test(normalizedRedirect))
    ? normalizedRedirect
    : (data.user.accountType === 'seller' ? '/manage.html' : '/');

  // Prevent buyer accounts from being redirected to sell or manage pages
  if (data.user.accountType === 'buyer' && (redirect.includes('sell.html') || redirect.includes('manage.html') || redirect.includes('manage-orders.html'))) {
    redirect = '/buyer-orders.html';
  }

  // Prevent seller accounts from being redirected to cart or buyer pages
  if (data.user.accountType === 'seller' && (redirect.includes('cart.html') || redirect.includes('buyer-orders.html'))) {
    redirect = '/manage.html';
  }

  setTimeout(() => location.href = redirect, 500);
});
</script>
</body>
</html>
