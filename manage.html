<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Manage your listings on RichStore.">
<title>Manage listings — RichStore</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site">
  <div class="site-inner">
    <a href="index.html" class="logo">RichStore<span class="dot">.</span></a>
    <form class="searchbar" onsubmit="event.preventDefault(); location.href='index.html?search='+encodeURIComponent(this.q.value)">
      <input type="text" name="q" placeholder="Search for anything…" autocomplete="off" aria-label="Search listings">
      <button type="submit">Search</button>
    </form>
    <div class="nav-actions">
      <a href="cart.html" class="cart-link" aria-label="Shopping cart">&#128722; <span class="cart-count" id="cart-count">0</span></a>
    </div>
  </div>
</header>

<main class="wrap" style="padding-top:24px;">
  <!-- Sub-navigation Tabs -->
  <div class="manage-subnav" style="display:flex;gap:10px;margin-bottom:24px;border-bottom:2px solid #eef1f6;padding-bottom:12px;flex-wrap:wrap;">
    <a href="manage.html" class="manage-tab-btn active" style="padding:9px 20px;border-radius:30px;font-weight:700;font-size:15.7px;text-decoration:none;color:#fff;background:var(--paper-raised);box-shadow:0 3px 10px rgba(0,0,205,0.25);">
      My Listings
    </a>
    <a href="manage-orders.html" class="manage-tab-btn" style="padding:9px 20px;border-radius:30px;font-weight:600;font-size:15.7px;text-decoration:none;color:var(--ink-lighter);background:#f0f4f8;transition:all 0.15s ease;">
      Manage Orders
    </a>
  </div>

  <h2 class="section-title">My listings</h2>
  <div id="listing-list"></div>
</main>

<footer class="site"><em>RichStore. Copyright © 2026</em></footer>
<script src="js/cart.js"></script>
<script>
(async function() {
  const token = localStorage.getItem('auth_token');
  if (!token) {
    location.href = '/login.html?redirect=/manage.html';
    return;
  }

  function renderMedia(emoji, color, title) {
    if (!emoji) return '';
    let src = '';
    if (typeof emoji === 'string' && emoji.includes('<img')) {
      const m = emoji.match(/src=["']([^"']+)["']/i);
      if (m) src = m[1];
    } else if (typeof emoji === 'string' && (
      emoji.startsWith('/') ||
      emoji.startsWith('http') ||
      emoji.startsWith('data:') ||
      emoji.includes('/') ||
      /\.(jpg|jpeg|png|gif|webp|svg|avif)$/i.test(emoji)
    )) {
      src = emoji;
    }
    if (src) {
      return `
        <div class="slot-backdrop" style="background-image: url('${escapeHTML(src)}');"></div>
        <img src="${escapeHTML(src)}" alt="${escapeHTML(title || 'Item image')}" loading="lazy">
      `;
    }
    return escapeHTML(emoji);
  }

  // Check auth then load listings
  try {
    const meRes = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
    if (!meRes.ok && meRes.status === 401) {
      localStorage.removeItem('auth_token');
      location.href = '/login.html?redirect=/manage.html';
      return;
    }
    if (meRes.ok) {
      const meData = await meRes.json();
      if (meData.user && meData.user.accountType === 'buyer') {
        location.href = '/buyer-orders.html';
        return;
      }
    }
  } catch (e) {
    // network error — continue to load listings anyway
  }

  async function loadListings() {
    const res = await fetch('/api/my-listings', {
      headers: { Authorization: 'Bearer ' + token }
    });
    const data = await res.json();
    const list = document.getElementById('listing-list');
    if (!res.ok) {
      list.innerHTML = '<p>' + escapeHTML(data.error || 'Unable to load listings') + '</p>';
      return;
    }

    if (!data.listings || data.listings.length === 0) {
      list.innerHTML = '<div class="empty-state"><p>You have no listings yet.</p><a href="sell.html" class="btn primary" style="margin-top:10px;display:inline-block;">Sell one now</a></div>';
      return;
    }

    list.innerHTML = data.listings.map(item => `
      <div class="card" style="margin-bottom:16px;">
        <div class="card-media" style="background:${escapeHTML(item.color)}22;">${renderMedia(item.emoji, item.color)}</div>
        <div class="card-body">
          <p class="card-title">${escapeHTML(item.title)}</p>
          <p class="card-meta">${escapeHTML(item.category)} · ${item.stock} in stock</p>
          <p class="card-price">${formatGHs(item.price)}</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn primary" data-edit="${item.id}" type="button" aria-label="Edit ${escapeHTML(item.title)}">Edit</button>
            <button class="btn" data-delete="${item.id}" type="button" aria-label="Delete ${escapeHTML(item.title)}">Delete</button>
          </div>
        </div>
      </div>
    `).join('');

    list.querySelectorAll('[data-delete]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Are you sure you want to delete this listing? This cannot be undone.')) return;
        const id = btn.dataset.delete;
        const r = await fetch('/api/listings/' + id, {
          method: 'DELETE',
          headers: { Authorization: 'Bearer ' + token }
        });
        const result = await r.json();
        if (!r.ok) {
          showToast(result.error || 'Delete failed');
          return;
        }
        showToast('Listing deleted');
        loadListings();
      });
    });

    list.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = Number(btn.dataset.edit);
        const item = data.listings.find(x => x.id === id);
        if (!item) return;
        const newTitle = prompt('Title', item.title);
        if (newTitle === null) return; // cancelled — do not overwrite anything

        const priceInput = prompt('Price (GHs)', item.price);
        if (priceInput === null) return; // cancelled — do not send a price of 0
        const stockInput = prompt('Stock (enter 0 to mark sold out)', item.stock);
        if (stockInput === null) return; // cancelled — do not send a stock of 0

        const newPrice = Number(priceInput);
        const newStock = Number(stockInput);

        if (priceInput.trim() === '' || !Number.isFinite(newPrice) || newPrice <= 0) {
          showToast('Invalid price. Please enter a number greater than 0.');
          return;
        }
        if (stockInput.trim() === '' || !Number.isInteger(newStock) || newStock < 0) {
          showToast('Invalid stock. Please enter a whole number of 0 or more.');
          return;
        }

        const payload = {
          title: newTitle.trim() || item.title,
          price: newPrice,
          stock: newStock,
        };
        const r = await fetch('/api/listings/' + id, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token,
          },
          body: JSON.stringify(payload),
        });
        const result = await r.json();
        if (!r.ok) {
          showToast(result.error || 'Update failed');
          return;
        }
        if (result.soldOut) {
          showToast(result.message || 'Stock is 0. Listing is marked sold out and hidden from shoppers.');
        } else {
          showToast('Listing updated');
        }
        loadListings();
      });
    });
  }

  loadListings();
})();
</script>
</body>
</html>
