<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="RichStore — browse, buy, and sell anything in our peer-to-peer marketplace.">
<title>RichStore — buy and sell anything</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <div class="site-inner">
    <a href="index.html" class="logo">RichStore<span class="dot">.</span></a>
    <form class="searchbar" id="search-form">
      <input type="text" id="search-input" placeholder="What are you looking for today?…" autocomplete="off" aria-label="Search listings">
      <button type="submit">Search</button>
    </form>
    <div class="nav-actions">
      <a href="buyer-orders.html" class="buyer-wallet-badge" id="buyer-wallet-badge" aria-label="Buyer account wallet" title="Amount paid by buyer securely held in account">
        <span class="wallet-badge-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="15" rx="3"></rect>
            <path d="M16 12h4"></path>
            <circle cx="18" cy="12" r="1" fill="currentColor"></circle>
          </svg>
        </span>
        <span class="wallet-badge-label">Account:</span>
        <span class="wallet-badge-amount" id="buyer-wallet-amount">GHs 0.00</span>
      </a>
      <a href="sell.html" class="btn primary btn-sell">Sell an item</a>
      <a href="cart.html" class="cart-link" aria-label="Shopping cart">&#128722; <span class="cart-count" id="cart-count">0</span></a>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty" style="display:none;">
    <div class="big">🔍</div>
    <p>No listings match your search. Try a different term or category.</p>
  </div>
</main>

<footer class="site"><em>RichStore. Copyright © 2026</em></footer>

<script src="js/cart.js"></script>
<script>
let currentCategory = "All";
let currentSearch = "";
let cachedCategories = null;

// Parse URL query parameters on page load
(function initFromURL() {
  const params = new URLSearchParams(location.search);
  const catParam = params.get("cat");
  const searchParam = params.get("search");

  if (catParam) currentCategory = catParam;
  if (searchParam) {
    currentSearch = searchParam;
    const input = document.getElementById("search-input");
    if (input) input.value = searchParam;
  }
})();

// Keep the current category/search reflected in the URL (shareable, survives refresh)
function syncUrlState() {
  const params = new URLSearchParams();
  if (currentCategory && currentCategory !== "All") params.set("cat", currentCategory);
  if (currentSearch) params.set("search", currentSearch);
  const qs = params.toString();
  history.replaceState(null, "", qs ? (location.pathname + "?" + qs) : location.pathname);
}

async function loadCategories() {
  if (cachedCategories) {
    renderChips(cachedCategories);
    return;
  }
  const { ok, data } = await api.get("/api/categories");
  if (!ok || !data || !Array.isArray(data.categories)) {
    renderChipsError();
    return;
  }
  cachedCategories = data.categories;
  renderChips(cachedCategories);
}

function renderChipsError() {
  const container = document.getElementById("chips");
  if (!container) return;
  container.innerHTML = `
    <span style="font-size:14.6px;color:var(--ink-lighter);">
      Categories unavailable — <a href="#" id="chips-retry" style="font-weight:700;">Retry</a>
    </span>`;
  document.getElementById("chips-retry")?.addEventListener("click", (e) => {
    e.preventDefault();
    loadCategories();
  });
}

function renderChips(categories) {
  const container = document.getElementById("chips");
  const cats = ["All", ...categories];
  container.innerHTML = cats.map(c => `
    <button class="chip ${c === currentCategory ? 'active' : ''}" data-cat="${escapeHTML(c)}" role="tab" aria-selected="${c === currentCategory}">${escapeHTML(c)}</button>
  `).join("");

  container.querySelectorAll(".chip").forEach(chip => {
    const handler = () => {
      currentCategory = chip.dataset.cat;
      container.querySelectorAll(".chip").forEach(c => {
        c.classList.remove("active");
        c.setAttribute('aria-selected', 'false');
      });
      chip.classList.add("active");
      chip.setAttribute('aria-selected', 'true');
      loadListings();
    };
    chip.addEventListener("click", handler);
    chip.addEventListener("keydown", (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handler(); } });
  });
}

window.selectCategoryMobile = function(cat) {
  currentCategory = cat;
  const container = document.getElementById("chips");
  if (container) {
    container.querySelectorAll(".chip").forEach(c => {
      if (c.dataset.cat === cat) {
        c.classList.add("active");
        c.setAttribute('aria-selected', 'true');
      } else {
        c.classList.remove("active");
        c.setAttribute('aria-selected', 'false');
      }
    });
  }
  loadListings();
};

function renderMedia(emoji, color, title) {
  if (!emoji) return '';
  let src = '';
  if (typeof emoji === 'string' && emoji.includes('<img')) {
    const m = emoji.match(/src=["']([^"']+)["']/i);
    if (m) src = m[1];
  } else if (typeof emoji === 'string' && (
    emoji.startsWith('/') ||
    emoji.startsWith('http') ||
    emoji.startsWith('data:') ||
    emoji.includes('/') ||
    /\.(jpg|jpeg|png|gif|webp|svg|avif)$/i.test(emoji)
  )) {
    src = emoji;
  }
  if (src) {
    return `
      <div class="card-media has-image" style="background:${escapeHTML(color || '#2F6F63')}22;">
        <div class="slot-backdrop" style="background-image: url('${escapeHTML(src)}');"></div>
        <img src="${escapeHTML(src)}" alt="${escapeHTML(title || 'Item image')}" loading="lazy">
      </div>`;
  }
  return `<div class="card-media" style="background:${escapeHTML(color || '#2F6F63')}22;">${escapeHTML(emoji)}</div>`;
}

function cardHTML(item) {
  return `
    <a class="card" href="item.html?id=${item.id}">
      <div class="tag-corner" style="background:${escapeHTML(item.color)}">${escapeHTML(item.condition)}</div>
      ${renderMedia(item.emoji, item.color, item.title)}
      <div class="card-body">
        <p class="card-title">${escapeHTML(item.title)}</p>
        <p class="card-meta">${escapeHTML(item.category)} · ${Number(item.stock) > 0 ? Number(item.stock) + ' in stock' : 'Sold out'}</p>
        <p class="card-price">${formatGHs(item.price)}</p>
        ${Number(item.stock) > 0 ? `
          <button type="button" class="btn primary card-add-btn" data-add-id="${item.id}" data-add-title="${escapeHTML(item.title)}" style="width:60%;margin-top:8px;padding:8px 12px;font-size:14.6px;">Add to cart</button>` : ''}
      </div>
    </a>`;
}

// "Add to cart" from a listing card (the card itself is a link, so swallow the click)
function attachCardHandlers() {
  document.querySelectorAll("#grid .card-add-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = parseInt(btn.dataset.addId, 10);
      if (isNaN(id)) return;
      if (!Cart.add(id)) return; // seller account — Cart.add already toasts
      showToast(`Added "${btn.dataset.addTitle || 'item'}" to cart`);
      btn.textContent = "✓ Added to cart!";
      setTimeout(() => { btn.textContent = "Add to cart"; }, 1400);
    });
  });
}

function renderGridError(message) {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  if (!grid) return;
  if (empty) empty.style.display = "none";
  grid.innerHTML = `
    <div style="grid-column:1/-1;padding:44px 20px;text-align:center;">
      <p style="color:var(--tag-red);font-weight:600;margin:0 0 14px;">${escapeHTML(message)}</p>
      <button type="button" class="btn primary" id="grid-retry-btn" style="padding:10px 22px;">Retry</button>
    </div>`;
  document.getElementById("grid-retry-btn")?.addEventListener("click", () => loadListings());
}

async function loadListings() {
  const params = new URLSearchParams();
  if (currentCategory !== "All") params.set("category", currentCategory);
  if (currentSearch) params.set("search", currentSearch);

  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");

  // Loading state
  if (grid) {
    grid.innerHTML = `<div style="grid-column:1/-1;padding:44px 20px;text-align:center;color:var(--ink-lighter);font-weight:600;">Loading listings…</div>`;
  }
  if (empty) empty.style.display = "none";

  const { ok, data } = await api.get("/api/listings?" + params.toString());
  if (!ok) {
    renderGridError((data && data.error) || "We couldn't load listings. Please try again.");
    return;
  }
  const listings = Array.isArray(data.listings) ? data.listings : [];

  if (listings.length === 0) {
    if (grid) grid.innerHTML = "";
    if (empty) empty.style.display = "block";
  } else {
    if (empty) empty.style.display = "none";
    if (grid) {
      grid.innerHTML = listings.map(cardHTML).join("");
      attachCardHandlers();
    }
  }
  syncUrlState(); // reflect the active filters in the URL
}

document.getElementById("search-form").addEventListener("submit", (e) => {
  e.preventDefault();
  currentSearch = document.getElementById("search-input").value.trim();
  loadListings();
});

loadCategories();
loadListings();
</script>
</body>
</html>
