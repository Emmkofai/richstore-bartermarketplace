<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Track your orders on RichStore.">
<title>My Orders & Tracking — RichStore</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site">
  <div class="site-inner">
    <a href="index.html" class="logo">RichStore<span class="dot">.</span></a>
    <form class="searchbar" onsubmit="event.preventDefault(); location.href='index.html?search='+encodeURIComponent(this.q.value)">
      <input type="text" name="q" placeholder="Search for anything…" autocomplete="off" aria-label="Search listings">
      <button type="submit">Search</button>
    </form>
    <div class="nav-actions">
      <a href="cart.html" class="cart-link" aria-label="Shopping cart">🛒 <span class="cart-count" id="cart-count">0</span></a>
    </div>
  </div>
</header>

<main class="wrap" style="padding-top:28px;">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px;">
    <div>
      <h1 class="section-title" style="margin:0 0 4px;">My Orders & Tracking</h1>
      <p style="color:var(--ink-lighter);font-size:15.7px;margin:0;">
        Track delivery progress and contact sellers for your purchases
      </p>
    </div>
    <div style="display:flex;gap:10px;">
      <button type="button" class="btn secondary" id="btn-refresh" onclick="loadOrders()" style="padding:10px 18px;font-size:15.7px;">
        Refresh
      </button>
      <a href="index.html" class="btn primary" style="padding:10px 18px;font-size:15.7px;text-decoration:none;">
        Shop More
      </a>
    </div>
  </div>

  <div id="orders-container">
    <div style="text-align:center;padding:60px 20px;color:var(--ink-lighter);">
      Loading your orders…
    </div>
  </div>
</main>

<footer class="site"><em>RichStore. Copyright © 2026</em></footer>

<script src="js/cart.js"></script>
<script>
async function loadOrders() {
  const container = document.getElementById('orders-container');
  const token = localStorage.getItem('auth_token');

  if (!token) {
    location.href = '/login.html?redirect=/buyer-orders.html';
    return;
  }

  // Role gate: this page is buyer-only (mirrors manage.html / manage-orders.html)
  try {
    const meRes = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
    if (meRes.ok) {
      const meData = await meRes.json();
      if (meData.user && meData.user.accountType && meData.user.accountType !== 'buyer') {
        location.href = '/manage-orders.html';
        return;
      }
    }
  } catch (e) {}

  container.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--ink-lighter);">Loading your orders…</div>`;

  try {
    const res = await fetch('/api/my-orders', {
      headers: { Authorization: 'Bearer ' + token }
    });

    if (res.status === 401) {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('auth_user');
      location.href = '/login.html?redirect=/buyer-orders.html';
      return;
    }

    const data = await res.json();
    const orders = data.orders || [];

    if (orders.length === 0) {
      container.innerHTML = `
        <div style="text-align:center;background:#fff;border-radius:16px;padding:60px 24px;border:2px dashed #e2e8f0;max-width:560px;margin:30px auto;">
          <h2 style="font-size:22.4px;font-weight:700;color:#1E2B23;margin:0 0 8px;">No orders found yet</h2>
          <p style="color:var(--ink-lighter);font-size:15.7px;margin:0 0 20px;">You haven't placed any orders yet. Discover great items on RichStore!</p>
          <a href="/" class="btn primary" style="display:inline-block;padding:12px 28px;text-decoration:none;font-weight:700;">Start Shopping</a>
        </div>
      `;
      return;
    }

    container.innerHTML = orders.map(renderOrderCard).join('');
  } catch (err) {
    container.innerHTML = `
      <div style="text-align:center;padding:40px;color:var(--tag-red);font-weight:600;">
        Failed to load orders. Please try again.
      </div>
    `;
  }
}

function getStatusStepIndex(status) {
  const s = String(status || '').toLowerCase();
  if (s === 'pending' || s === 'pendingpayment') return 0;
  if (s === 'processing' || s === 'held') return 1;
  if (s === 'dispatched') return 2;
  if (s === 'delivered' || s === 'completed' || s === 'released') return 3;
  if (s === 'cancelled' || s === 'refunded') return -1;
  return 1;
}

function formatEscrowTimer(isoDate) {
  if (!isoDate) return '';
  const expires = new Date(isoDate).getTime();
  const diff = expires - Date.now();
  if (diff <= 0) {
    return '<span style="color:#dc2626;font-weight:700;">⏱️ 24h Window Elapsed (Eligible for Auto-Refund)</span>';
  }
  const hours = Math.floor(diff / (1000 * 60 * 60));
  const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  return `<span style="color:#d97706;font-weight:700;">⏱️ ${hours}h ${mins}m delivery window remaining</span>`;
}

// ---- Honest payment + escrow derivation ---------------------------------------------------
// A payment is only real when the server says paymentStatus === 'paid' AND escrowStatus is
// Held/Released/Refunded. Anything else means no money has moved, so we never claim it has.

// Single pill describing the money state, driven strictly by paymentStatus + escrowStatus.
function getPaymentBadge(o) {
  const ps = String(o.paymentStatus || '').toLowerCase();
  const es = String(o.escrowStatus || '').toLowerCase();
  const pill = (label, bg, color, dot) =>
    `<span class="order-status-pill" style="background:${bg};color:${color};">` +
    `<span style="width:7px;height:7px;border-radius:50%;background:${dot};display:inline-block;"></span>${escapeHTML(label)}</span>`;
  if (ps === 'paid' && es === 'held')     return pill('Paid · Held in escrow', '#ecfdf5', '#065f46', '#059669');
  if (ps === 'paid' && es === 'released') return pill('Paid · Released to seller', '#dcfce7', '#166534', '#059669');
  if (ps === 'paid' && es === 'refunded') return pill('Paid · Refunded', '#fef2f2', '#991b1b', '#dc2626');
  if (ps === 'expired')                   return pill('Payment expired', '#f1f5f9', '#475569', '#94a3b8');
  if (ps === 'unverified')                return pill('Payment unverified', '#fffbeb', '#92400e', '#d97706');
  if (ps === 'pending')                   return pill('Awaiting payment', '#fef3c7', '#92400e', '#d97706');
  return pill('Payment status unknown', '#f1f5f9', '#475569', '#94a3b8');
}

// Countdown for the 24h checkout window — distinct wording from the delivery window above.
function formatPaymentCountdown(isoDate) {
  if (!isoDate) return '';
  const diff = new Date(isoDate).getTime() - Date.now();
  if (isNaN(diff)) return '';
  if (diff <= 0) return '<span style="color:#dc2626;font-weight:700;">⏱️ Payment window closed</span>';
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  return `<span style="color:#d97706;font-weight:700;">⏱️ Pay within ${h}h ${m}m</span>`;
}

// Normalise payouts: the contract returns payouts.sellers[], but payouts.seller exists for
// back-compat. Buyer cards only speak about whichever entries we actually received.
function getPayoutList(o) {
  const p = o.payouts || {};
  if (Array.isArray(p.sellers) && p.sellers.length) return p.sellers;
  if (p.seller) return [p.seller];
  return [];
}

// Two-step inline confirmation (replaces the old blocking confirm()/alert()).
// The first click arms the button; a second click within 6s performs the action.
function armConfirm(btn, armedText) {
  if (!btn) return false;
  if (btn.dataset.confirming === '1') return true;
  btn.dataset.confirming = '1';
  if (!btn.dataset.originalText) btn.dataset.originalText = btn.textContent.trim();
  btn.textContent = armedText;
  clearTimeout(btn._confirmTimer);
  btn._confirmTimer = setTimeout(() => {
    btn.dataset.confirming = '0';
    if (btn.dataset.originalText) btn.textContent = btn.dataset.originalText;
  }, 6000);
  return false;
}

function resetConfirm(btn) {
  if (!btn) return;
  clearTimeout(btn._confirmTimer);
  btn.dataset.confirming = '0';
  if (btn.dataset.originalText) btn.textContent = btn.dataset.originalText;
  btn.disabled = false;
}

async function confirmDelivery(orderId, sellerName, amount, btn) {
  if (!armConfirm(btn, 'Click again to confirm release')) {
    if (btn) showToast(`Confirm receipt of Order #${orderId} to release ${formatGHs(amount)} to ${sellerName}. Click the button again to confirm.`, 6000);
    return;
  }
  const token = localStorage.getItem('auth_token');
  try {
    const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}/confirm-delivery`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    if (res.ok) {
      showToast(data.message || 'Delivery confirmed! Funds released successfully.');
      loadOrders();
    } else {
      showToast(data.error || 'Failed to release funds');
      resetConfirm(btn);
    }
  } catch (err) {
    showToast('Network error while releasing funds');
    resetConfirm(btn);
  }
}

async function requestRefund(orderId, amount, btn) {
  if (!armConfirm(btn, 'Click again to confirm refund')) {
    if (btn) showToast(`Cancel Order #${orderId} and refund ${formatGHs(amount)}? Click the button again to confirm.`, 6000);
    return;
  }
  const token = localStorage.getItem('auth_token');
  try {
    const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}/refund`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    if (res.ok) {
      showToast(data.message || 'Refund successfully processed.');
      loadOrders();
    } else {
      showToast(data.error || 'Failed to process refund');
      resetConfirm(btn);
    }
  } catch (err) {
    showToast('Network error while processing refund');
    resetConfirm(btn);
  }
}

function renderOrderCard(o) {
  const status = (o.status || 'Processing').toLowerCase();
  const stepIdx = getStatusStepIndex(status);
  const isCancelled = status === 'cancelled' || status === 'refunded';
  // Never default escrow to "Held": an order with no escrowStatus simply has not been paid
  // yet, and defaulting to "Held" would falsely imply the buyer's money was captured.
  const es = String(o.escrowStatus || '').toLowerCase();
  const ps = String(o.paymentStatus || '').toLowerCase();
  const orderTotal = Number(o.total) || 0;
  const sellerPayout = Number(o.sellerPayoutAmount || o.subtotal) || 0;
  const siteFee = Number(o.siteFeeAmount || o.siteFee) || 0;

  const placedDate = o.placedAt ? formatDate(o.placedAt) : 'Recently';

  const items = Array.isArray(o.items) ? o.items : [];
  const sellerName = (items[0] && items[0].seller) || 'RichStore Seller';
  const timerHtml = o.escrowExpiresAt ? formatEscrowTimer(o.escrowExpiresAt) : '';

  let escrowBannerHtml = '';

  if (ps === 'paid' && es === 'held') {
    escrowBannerHtml = `
      <div style="background:#ecfdf5;border:1.5px solid #a7f3d0;border-radius:12px;padding:14px 18px;margin:14px 0 16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:24.6px;">🛡️</span>
            <strong style="color:#065f46;font-size:15.7px;letter-spacing:0.3px;">SECURE ACCOUNT: ${formatGHs(orderTotal)} WITHHELD BY RICHSTORE</strong>
          </div>
          <div style="font-size:13.4px;">${timerHtml}</div>
        </div>
        <p style="margin:0;font-size:14.6px;line-height:1.5;color:#064e3b;">
          Your money is safely held in platform account. The seller cannot claim this payment until you receive your items and click <strong>"Confirm Delivery & Release Funds"</strong> below.
        </p>
      </div>
    `;
  } else if (ps === 'paid' && es === 'released') {
    // Speak only about the payout data we actually received. A payout whose status is PENDING
    // has NOT been paid out, so we must never say funds were "disbursed" in that case.
    const payouts = getPayoutList(o);
    let inner;
    if (!payouts.length) {
      inner = `<div style="font-size:14.6px;color:#92400e;font-weight:600;">Order released. Payout details aren't available here yet.</div>`;
    } else {
      inner = payouts.map(p => {
        const who = p.recipient || p.name || 'the seller';
        const amt = formatGHs(Number(p.amount) || 0);
        const st = String(p.status || '').toUpperCase();
        const note = p.note ? ` ${escapeHTML(p.note)}` : '';
        if (st === 'SUCCESS') return `<div style="font-size:14.6px;color:#166534;font-weight:600;margin-top:4px;">✅ Payment sent: ${amt} was transferred to ${escapeHTML(who)}.${note}</div>`;
        if (st === 'FAILED')  return `<div style="font-size:14.6px;color:#991b1b;font-weight:600;margin-top:4px;">⚠️ Payout of ${amt} to ${escapeHTML(who)} failed and needs attention.${note}</div>`;
        return `<div style="font-size:14.6px;color:#92400e;font-weight:600;margin-top:4px;">⏳ Payout queued: ${amt} to ${escapeHTML(who)} is awaiting settlement.${note}</div>`;
      }).join('');
    }
    escrowBannerHtml = `
      <div style="background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:12px;padding:12px 18px;margin:14px 0 16px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:2px;">
          <span style="font-size:22.4px;">✅</span>
          <strong style="color:#166534;font-size:15.7px;">Order released</strong>
        </div>
        ${inner}
      </div>
    `;
  } else if (ps === 'paid' && es === 'refunded') {
    // refundDetails.status decides the claim: only say "refunded" when it actually succeeded.
    const rd = o.refundDetails || {};
    const rst = String(rd.status || '').toUpperCase();
    let msg, color;
    if (rst === 'SUCCESS')      { msg = `Refund processed: ${formatGHs(orderTotal)} was refunded to your original payment method.`; color = '#991b1b'; }
    else if (rst === 'FAILED')  { msg = `Refund of ${formatGHs(orderTotal)} failed and needs attention.`; color = '#991b1b'; }
    else if (rst === 'PENDING') { msg = `Refund queued: ${formatGHs(orderTotal)} will be settled manually.`; color = '#92400e'; }
    else                        { msg = `Order marked refunded. Refund settlement details aren't available here yet.`; color = '#92400e'; }
    const note = rd.note ? ` ${escapeHTML(rd.note)}` : '';
    escrowBannerHtml = `
      <div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:12px;padding:12px 18px;margin:14px 0 16px;display:flex;align-items:center;gap:10px;">
        <span style="font-size:22.4px;">🔄</span>
        <div style="font-size:14.6px;color:${color};font-weight:600;">
          ${escapeHTML(msg)}${note}
        </div>
      </div>
    `;
  }

  // Payment-state action panel: what the buyer still needs to do (pending / expired / unverified).
  let paymentActionHtml = '';
  if (ps === 'pending') {
    paymentActionHtml = `
      <div style="background:#fffbeb;border:1.5px solid #fde68a;border-radius:12px;padding:14px 18px;margin:14px 0 16px;">
        <div style="font-weight:800;color:#92400e;font-size:15.7px;margin-bottom:6px;">⏳ Waiting for your payment</div>
        <p style="margin:0 0 10px;font-size:14.6px;line-height:1.5;color:#78350f;">
          This order is reserved but not paid yet. Complete payment before the window closes to keep your items.
        </p>
        ${o.paymentReference ? `<div style="font-size:14.6px;color:#78350f;margin-bottom:4px;">Payment reference: <strong style="font-family:var(--font-numeric);font-variant-numeric:tabular-nums;user-select:all;letter-spacing:0.3px;">${escapeHTML(o.paymentReference)}</strong></div>` : ''}
        ${o.paymentExpiresAt ? `<div style="font-size:13.4px;margin-bottom:12px;">${formatPaymentCountdown(o.paymentExpiresAt)}</div>` : ''}
        <a href="pay.html?order=${encodeURIComponent(o.id)}" class="btn primary" style="display:inline-block;padding:11px 22px;font-size:15.7px;font-weight:700;text-decoration:none;">Complete payment</a>
      </div>`;
  } else if (ps === 'expired') {
    paymentActionHtml = `
      <div style="background:#f1f5f9;border:1.5px solid #cbd5e1;border-radius:12px;padding:14px 18px;margin:14px 0 16px;">
        <div style="font-weight:800;color:#334155;font-size:15.7px;margin-bottom:6px;">⌛ Payment window expired</div>
        <p style="margin:0 0 10px;font-size:14.6px;line-height:1.5;color:#475569;">
          The 24-hour payment window closed, so the reserved stock was released and <strong>nothing was charged</strong>.
        </p>
        <a href="index.html" class="btn secondary" style="display:inline-block;padding:10px 20px;font-size:15.7px;font-weight:700;text-decoration:none;">Re-order from the shop</a>
      </div>`;
  } else if (ps === 'unverified') {
    paymentActionHtml = `
      <div style="background:#fffbeb;border:1.5px solid #fde68a;border-radius:12px;padding:14px 18px;margin:14px 0 16px;font-size:14.6px;color:#92400e;line-height:1.5;">
        ⚠️ We haven't been able to confirm this payment yet. If you have already paid, it will be reconciled shortly.
        ${o.paymentReference ? `<div style="margin-top:6px;">Reference: <strong style="font-family:var(--font-numeric);user-select:all;">${escapeHTML(o.paymentReference)}</strong></div>` : ''}
      </div>`;
  }

  return `
    <div class="order-tracking-card">
      <div class="order-tracking-header">
        <div>
          <span class="order-tracking-id">${escapeHTML(o.id)}</span>
          <span style="color:#cbd5e1;margin:0 8px;">•</span>
          <span class="order-tracking-date">Placed on ${placedDate}</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <span class="order-status-pill ${escapeHTML(status)}">
            ${escapeHTML(o.status || 'Processing')}
          </span>
          ${getPaymentBadge(o)}
        </div>
      </div>

      ${escrowBannerHtml}

      ${paymentActionHtml}

      <!-- Tracking Progress Bar -->
      ${!isCancelled ? `
        <div class="order-timeline">
          <div class="timeline-step ${stepIdx >= 0 ? (stepIdx > 0 ? 'completed' : 'active') : ''}">
            <div class="timeline-dot">${stepIdx > 0 ? '✓' : '1'}</div>
            <div class="timeline-label">Order Placed</div>
          </div>
          <div class="timeline-step ${stepIdx >= 1 ? (stepIdx > 1 ? 'completed' : 'active') : ''}">
            <div class="timeline-dot">${stepIdx > 1 ? '✓' : '2'}</div>
            <div class="timeline-label">Account Held</div>
          </div>
          <div class="timeline-step ${stepIdx >= 2 ? (stepIdx > 2 ? 'completed' : 'active') : ''}">
            <div class="timeline-dot">${stepIdx > 2 ? '✓' : '3'}</div>
            <div class="timeline-label">Dispatched</div>
          </div>
          <div class="timeline-step ${stepIdx >= 3 ? 'completed active' : ''}">
            <div class="timeline-dot">${stepIdx >= 3 ? '✓' : '4'}</div>
            <div class="timeline-label">Delivered / Released</div>
          </div>
        </div>
      ` : `
        <div style="background:#fee2e2;color:#991b1b;padding:12px 16px;border-radius:10px;font-size:14.6px;font-weight:600;margin:12px 0;">
          This order was cancelled and refunded.
        </div>
      `}

      <!-- Delivery Details -->
      <div style="margin:16px 0;background:#f8fafc;padding:12px 16px;border-radius:10px;font-size:14.6px;display:flex;flex-wrap:wrap;gap:18px;">
        <div>
          <span style="color:#64748b;font-weight:600;">Recipient:</span>
          <strong style="color:#1E2B23;margin-left:4px;">${escapeHTML(o.buyerName || 'Valued Customer')}</strong>
        </div>
        <div>
          <span style="color:#64748b;font-weight:600;">Delivery Address:</span>
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.buyerLocation || 'Accra, Ghana')}" target="_blank" rel="noopener noreferrer" style="color:#0000CD;font-weight:700;margin-left:4px;text-decoration:none;display:inline-flex;align-items:center;gap:3px;" title="Open location in Google Maps">
            📍 ${escapeHTML(o.buyerLocation || 'Accra, Ghana')}
          </a>
        </div>
        <div>
          <span style="color:#64748b;font-weight:600;">Phone:</span>
          <strong style="color:#1E2B23;margin-left:4px;">${escapeHTML(o.buyerPhone || 'N/A')}</strong>
        </div>
      </div>

      <!-- Items in Order -->
      <div class="order-items-preview">
        <div style="font-size:13.4px;font-weight:700;text-transform:uppercase;color:#64748b;margin-bottom:8px;letter-spacing:0.4px;">
          Ordered Items (${o.totalQuantity || items.length} ${Number(o.totalQuantity) === 1 ? 'item' : 'items'})
        </div>
        ${items.map(it => {
          const sPhone = it.sellerPhone || '';
          const cleanPhone = sPhone.replace(/\D/g, '');
          const waPhone = cleanPhone.startsWith('233') ? cleanPhone : (cleanPhone.startsWith('0') ? '233' + cleanPhone.slice(1) : (cleanPhone.length === 9 ? '233' + cleanPhone : cleanPhone));
          const waLink = waPhone ? `https://wa.me/${waPhone}?text=${encodeURIComponent(`Hello, I am inquiring about my RichStore order ${o.id} for "${it.title}".`)}` : '';
          
          const itemAlt = escapeHTML(it.title || 'Ordered item');
          const imgHtml = (it.images && it.images[0])
            ? `<img src="${escapeHTML(it.images[0])}" alt="Photo of ${itemAlt}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid #e2e8f0;flex-shrink:0;">`
            : (it.emoji && it.emoji.startsWith('/uploads/')
              ? `<img src="${escapeHTML(it.emoji)}" alt="Photo of ${itemAlt}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid #e2e8f0;flex-shrink:0;">`
              : `<span role="img" aria-label="${itemAlt}" style="font-size:24.6px;line-height:1;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border-radius:8px;flex-shrink:0;">${escapeHTML(it.emoji || '📦')}</span>`);

          return `
            <div class="order-item-row" style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f1f5f9;flex-wrap:wrap;gap:12px;">
              <div style="display:flex;align-items:center;gap:12px;min-width:240px;flex:1;">
                ${imgHtml}
                <div>
                  <div style="font-weight:700;color:#1E2B23;font-size:15.7px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;">
                    <span><span style="color:#0000CD;margin-right:4px;">${Number(it.qty) || 1}×</span>${escapeHTML(it.title || 'Item')}</span>
                  </div>
                  <div style="font-size:13.4px;color:var(--ink-lighter);margin-top:2px;">
                    Seller: <strong style="color:var(--ink);">${escapeHTML(it.seller || 'RichStore')}</strong>
                    ${sPhone ? ` • <a href="tel:${escapeHTML(sPhone)}" style="color:#0000CD;text-decoration:none;font-weight:600;">📞 ${escapeHTML(sPhone)}</a>` : ''}
                  </div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:12px;margin-left:auto;">
                <div style="text-align:right;">
                  <span style="font-weight:800;color:#047857;font-size:16.8px;font-family:var(--font-numeric);font-variant-numeric:tabular-nums;">${formatGHs(Number(it.price) * (Number(it.qty) || 1))}</span>
                  <div style="font-size:12.3px;color:var(--ink-lighter);font-family:var(--font-numeric);font-variant-numeric:tabular-nums;">${Number(it.qty) || 1} × ${formatGHs(it.price)}</div>
                </div>
                ${waLink ? `
                  <a href="${waLink}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;background:#25D366;color:#fff;border-radius:8px;font-size:13.4px;font-weight:700;text-decoration:none;">
                    WhatsApp
                  </a>
                ` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <!-- Totals & Fee Breakdown -->
      <div class="order-total-bar" style="flex-direction:column;align-items:flex-end;gap:4px;">
        <div style="font-size:14.6px;color:#64748b;font-weight:500;font-family:var(--font-numeric);font-variant-numeric:tabular-nums;">
          Seller Items Subtotal: ${formatGHs(sellerPayout)}
        </div>
        <div style="font-size:14.6px;color:#2563eb;font-weight:500;font-family:var(--font-numeric);font-variant-numeric:tabular-nums;">
          Platform Site Charge (5%): +${formatGHs(siteFee)}
        </div>
        <div style="margin-top:4px;border-top:1px solid #e2e8f0;padding-top:4px;">
          <span style="font-size:15.7px;color:#475569;font-weight:600;">Amount Payable (${ps === 'expired' ? 'Not charged' : (ps === 'paid' ? (es === 'released' ? 'Paid · Released' : (es === 'refunded' ? 'Paid · Refunded' : 'Paid · Held in account')) : 'Pending payment')}): </span>
          <span style="color:#047857;font-size:20.2px;font-weight:800;font-family:var(--font-numeric);font-variant-numeric:tabular-nums;">${formatGHs(orderTotal)}</span>
        </div>
      </div>

      <!-- Account Actions & Confirmation Bar -->
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
        <div style="font-size:13.4px;color:#64748b;">
           ${(ps === 'paid' && es === 'held') ? '⚠️ Only confirm delivery after receiving and inspecting your items.' : ''}
        </div>
        <div style="display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;">
          ${o.canRefund ? `
            <button type="button" class="btn secondary" onclick="requestRefund('${escapeHTML(o.id)}', ${orderTotal}, this)" style="padding:8px 16px;font-size:14.6px;color:#dc2626;border-color:#fca5a5;background:#fff;cursor:pointer;">
              Request Refund (Non-Delivery)
            </button>
          ` : ''}
          ${o.canConfirmDelivery ? `
            <button type="button" class="btn primary" onclick="confirmDelivery('${escapeHTML(o.id)}', '${escapeHTML(sellerName)}', ${sellerPayout}, this)" style="padding:9px 18px;font-size:14.6px;font-weight:700;background:#047857;border-color:#047857;color:#fff;cursor:pointer;">
              ✓ Confirm Delivery & Release Funds
            </button>
          ` : ''}
        </div>
      </div>
    </div>
  `;
}

document.addEventListener('DOMContentLoaded', loadOrders);
</script>
</body>
</html>
